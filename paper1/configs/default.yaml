data:
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  target: "copper"
  train_end: "2019-12-31"
  val_end: "2021-12-31"
  # test: 2022-01-01 to end

  # Current scope is 15 variables: the 11 Yahoo Finance tickers below plus 4
  # FRED-sourced series (baa10y, dfii10 daily; ppiaco, indpro monthly and
  # point-in-time joined with a publication lag). The FRED series are NOT listed
  # here because they are not yfinance tickers -- they are pulled by
  # DataDownloader._download_fred_extensions() via src/fred_utils.py. See
  # paper1/PLAN.md Section 1 for the N=8 -> N=15 expansion and per-variable
  # verification; this supersedes the previously locked 8-variable,
  # Yahoo-Finance-only scope in docs/archive/vmd-mfgnn-protocol-SKILL.md.
  # This block must match src/data_pipeline.py's TICKERS exactly (nothing in
  # src/ currently reads it -- TICKERS is the single source of truth; this
  # block is documentation only, kept in sync manually). It previously listed
  # a stale 12-ticker/N=16 version including aluminum, which src/data_pipeline.py
  # removed this session (real Yahoo Finance history starts 2014-05-06, not
  # 2010 -- see TICKERS' own comment there for the full reason) -- corrected
  # here to match, since a stale copy here risks being copy-pasted into the
  # paper's variable table despite the code already having moved on.
  # NOTE (2026-08-07, retained as history): zinc/nickel dropped -- their NASDAQ
  # sub-index proxies (^NQCIZNER / ^NQCINIER) are confirmed dead/delisted on
  # Yahoo Finance as of a live production run.
  tickers:
    copper: "HG=F"
    # aluminum: "ALI=F" -- REMOVED, see src/data_pipeline.py's TICKERS comment.
    gold: "GC=F"
    oil: "CL=F"
    dxy: "DX-Y.NYB"
    sp500: "^GSPC"
    vix: "^VIX"
    us10y: "^TNX"
    silver: "SI=F"
    clp: "CLP=X"
    fcx: "FCX"
    fxi: "FXI"

  lookback: 60
  horizons: [1, 5, 10, 22]

vmd:
  K: 5
  alpha: 2000
  tau: 0.0
  tol: 1.0e-7
  max_iter: 500
  rolling_window: 252  # used by the (unused-by-default) rolling VMDDecomposer
  refit_interval: 21  # expanding-window VMD refit cadence (leakage-safe default path)

model:
  hidden_dim: 64
  num_heads: 4
  num_gnn_layers: 2
  temporal_module: "lstm"  # lstm or transformer
  temporal_layers: 2
  dropout: 0.1
  graph_type: "learned"  # learned, correlation
  # OFF by default (False = unchanged verified-pipeline behavior). When
  # True, L2-normalizes the graph embeddings (emb1/emb2) to unit norm
  # before the bilinear dot product in FrequencyGraphConstructor, so the
  # adjacency logits become cosine similarities immune to the embedding
  # norm collapse diagnosed in STATUS.md ("Adjacency Collapse Diagnosed").
  normalize_graph_embeddings: false
  # OFF by default (False = unchanged verified-pipeline behavior). When
  # True, FrequencyGraphConstructor gets one learnable scalar
  # log-temperature `s` per band and uses softmax(logits / exp(s)) for the
  # adjacency (s init 0.0 => tau == 1.0 => identical to the default path at
  # step 0). Additive to normalize_graph_embeddings, not a replacement:
  # normalization alone caps the max/min edge-weight ratio at ~2-2.7x, which
  # is barely above the ~2.08x a frozen-random graph gets for free. The
  # log-parameterization is load-bearing -- a raw `tau` parameter collapses
  # to ~2e-4 under weight decay and re-uniformizes the graph. Pair with
  # training.no_decay_graph_embeddings (which also excludes `s` from decay).
  use_graph_temperature: false

training:
  batch_size: 32
  epochs: 200
  learning_rate: 0.001
  weight_decay: 1.0e-5
  patience: 20
  # OFF by default (0 = unchanged verified-pipeline behavior: the best-val
  # checkpoint is eligible from epoch 0). When > 0, no checkpoint before
  # epoch `min_epochs - 1` is eligible to become the "best" evaluated
  # checkpoint, even if its val loss is lower -- see trainer.py's fit() and
  # EarlyStopper.should_stop(). Added after finding that several
  # ablation-study variants' best-val checkpoint landed at epoch 0-5 (val
  # loss never improved after initialization), confounding RMSE/MAE/DA
  # comparisons with training length rather than architecture (see
  # main.tex's Ablation Study section, M1/M2).
  # Turned ON for the N=15 consolidated run (PLAN.md "close the self-disclosed
  # epoch-count gap"): 30, not the 0 default, because this session's own null-
  # control-experiment docstring independently puts collapse onset at roughly
  # epoch 20-30 once validation loss plateaus, and several PRE-fix ablation
  # variants were previously observed landing their best-val checkpoint at
  # epoch 0-5 (see the comment above). 30 is conservative relative to that
  # onset estimate without being large enough to meaningfully delay early
  # stopping for models that genuinely do converge fast. Applies uniformly to
  # VMD-MFGNN, all 8 baselines (min_epochs now threaded into TorchBaseline.fit,
  # see PLAN.md), and all 8 ablation variants.
  min_epochs: 30
  scheduler: "cosine"
  seed: 42
  # OFF by default (False = unchanged verified-pipeline behavior). When
  # True, excludes FrequencyGraphConstructor's emb1/emb2 parameters from
  # Adam's weight_decay, targeting the root cause in STATUS.md
  # ("Adjacency Collapse Diagnosed"): coupled L2 decay pulls these
  # embeddings toward zero faster than the weak task gradient can resist,
  # collapsing the learned adjacency to uniform (1/N).
  no_decay_graph_embeddings: false
  # Selectable training loss (item 3: alternative loss function comparison).
  # "mse" (default) reproduces unchanged, already-verified behavior (plain
  # F.mse_loss, exactly as before this option existed). Other options:
  # "mae" (F.l1_loss), "huber" (F.smooth_l1_loss, beta=1.0). See src/trainer.py.
  loss_fn: "mse"
  # Per-horizon loss weighting. "none" (default) reproduces unchanged,
  # already-verified behavior: an unweighted sum of per-horizon losses --
  # under which h=22 (target variance ~18x h=1's) dominates the combined
  # gradient, including the gradient reaching the shared graph layer, by
  # scale alone. "target_variance" divides each horizon's loss by that
  # horizon's TRAINING-split target variance; "naive_rmse" uses fixed
  # reference weights derived from this project's naive-baseline RMSEs
  # (0.018/0.040/0.055/0.076 for h=1/5/10/22). Both are mean-normalized to
  # 1.0 so the total loss magnitude (and hence the effective LR and
  # grad-clip threshold) is unchanged -- only the relative balance moves.
  # Set to "target_variance" for the N=15 consolidated run (was "none").
  # Chosen over "naive_rmse" as the more defensible default: it normalizes by
  # each horizon's own TRAINING-split target variance (a standard, dataset-
  # derived, hyperparameter-free normalization), rather than by fixed
  # external reference RMSEs that would need their own justification and go
  # stale the moment the dataset changes (as it just did, N=8->15). This
  # directly addresses the h=22-dominates-by-scale-alone imbalance the
  # unweighted "none" sum leaves in the gradient reaching the shared graph
  # layer (see PLAN.md Sec 3 / Sec 3c).
  horizon_loss_weighting: "target_variance"

# Hyperparameter optimization (Optuna, TPE + median pruning) -- opt-in, and
# scoped to VMD-MFGNN (the proposed model) ONLY. The 6 locked baselines
# (ARIMA/XGBoost/LSTM/Transformer/VMD-LSTM/SimpleMTGNN) and all 4 ablation
# variants are NEVER tuned by HPO; they always use the settings above /
# their own hardcoded defaults. This asymmetry is intentional (disclosed in
# the paper) and defaults to disabled so the already-verified pipeline
# behavior is unchanged unless a human explicitly opts in.
hpo:
  enabled: true
  n_trials: 10
  trial_epochs: 25
  # OFF by default (False = unchanged, already-verified 4-parameter search
  # space: hidden_dim/num_heads/learning_rate/dropout/num_gnn_layers). When
  # True, also searches weight_decay (log-uniform) and batch_size
  # (categorical) -- see item 5 (wider HPO pass). K is searched only when a
  # caller explicitly passes `data_by_k` to run_hpo() (see hpo.py / the
  # robustness-experiments notebook's Section 7), since tuning K requires
  # pre-built per-K datasets (VMD/EMD decomposition is not re-run per trial).
  # This checked-in default config is NEVER changed to widen the search --
  # the wider pass is invoked explicitly, out-of-band, by the notebook.
  search_weight_decay: false
  search_batch_size: false
