data:
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  target: "copper"
  train_end: "2019-12-31"
  val_end: "2021-12-31"
  # test: 2022-01-01 to end

  tickers:
    copper: "HG=F"
    aluminum: "ALI=F"
    zinc: "ZNC=F"
    nickel: "NI=F"
    gold: "GC=F"
    oil: "CL=F"
    dxy: "DX-Y.NYB"
    sp500: "^GSPC"
    vix: "^VIX"

  fred_series:
    us10y: "DGS10"
    bdi: "DBAIDTLNM"  # Baltic Dry Index (monthly, needs interpolation)

  lookback: 60
  horizons: [1, 5, 10, 22]

vmd:
  K: 5
  alpha: 2000
  tau: 0.0
  tol: 1e-7
  max_iter: 500
  rolling_window: 252  # 1 year rolling for leakage prevention

model:
  hidden_dim: 64
  num_heads: 4
  num_gnn_layers: 2
  temporal_module: "lstm"  # lstm or transformer
  temporal_layers: 2
  dropout: 0.1
  graph_type: "learned"  # learned, correlation, granger

training:
  batch_size: 32
  epochs: 200
  learning_rate: 0.001
  weight_decay: 1e-5
  patience: 20
  scheduler: "cosine"
  seed: 42
